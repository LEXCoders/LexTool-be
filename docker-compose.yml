version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - '${DB_PORT}:3306'
    environment:
      MYSQL_DATABASE: '${DB_NAME}'
      MYSQL_USER: '${DB_USER}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - mysql-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  mysql-network:
    driver: bridge
